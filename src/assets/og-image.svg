<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#0d1020"/>
    </linearGradient>
    <filter id="gc">
      <feGaussianBlur stdDeviation="60" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(0,212,255,0.04)" stroke-width="1">
    <line x1="0" y1="48"  x2="1200" y2="48"/>
    <line x1="0" y1="96"  x2="1200" y2="96"/>
    <line x1="0" y1="144" x2="1200" y2="144"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="288" x2="1200" y2="288"/>
    <line x1="0" y1="336" x2="1200" y2="336"/>
    <line x1="0" y1="384" x2="1200" y2="384"/>
    <line x1="0" y1="432" x2="1200" y2="432"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="528" x2="1200" y2="528"/>
    <line x1="0" y1="576" x2="1200" y2="576"/>
    <line x1="48"  y1="0" x2="48"  y2="630"/>
    <line x1="96"  y1="0" x2="96"  y2="630"/>
    <line x1="144" y1="0" x2="144" y2="630"/>
    <line x1="192" y1="0" x2="192" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="288" y1="0" x2="288" y2="630"/>
    <line x1="336" y1="0" x2="336" y2="630"/>
    <line x1="384" y1="0" x2="384" y2="630"/>
    <line x1="432" y1="0" x2="432" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="528" y1="0" x2="528" y2="630"/>
    <line x1="576" y1="0" x2="576" y2="630"/>
    <line x1="624" y1="0" x2="624" y2="630"/>
    <line x1="672" y1="0" x2="672" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="768" y1="0" x2="768" y2="630"/>
    <line x1="816" y1="0" x2="816" y2="630"/>
    <line x1="864" y1="0" x2="864" y2="630"/>
    <line x1="912" y1="0" x2="912" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1008" y1="0" x2="1008" y2="630"/>
    <line x1="1056" y1="0" x2="1056" y2="630"/>
    <line x1="1104" y1="0" x2="1104" y2="630"/>
    <line x1="1152" y1="0" x2="1152" y2="630"/>
  </g>

  <!-- Cyan orb -->
  <circle cx="200" cy="200" r="280" fill="rgba(0,212,255,0.06)" filter="url(#gc)"/>
  <!-- Magenta orb -->
  <circle cx="1050" cy="420" r="220" fill="rgba(192,38,211,0.05)" filter="url(#gc)"/>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>

  <!-- Corner brackets TL -->
  <path d="M40,80 L40,40 L80,40"   fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Corner brackets TR -->
  <path d="M1120,40 L1160,40 L1160,80" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Corner brackets BL -->
  <path d="M40,550 L40,590 L80,590" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Corner brackets BR -->
  <path d="M1120,590 L1160,590 L1160,550" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Logo mark -->
  <text x="80" y="118" font-family="monospace" font-size="18" fill="#00d4ff" opacity="0.8">◆</text>
  <text x="104" y="118" font-family="monospace" font-size="20" font-weight="600" fill="#ffffff">skywrite</text>
  <rect x="196" y="100" width="28" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="200" y="113" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">v0.1</text>

  <!-- Tag row -->
  <rect x="80" y="138" width="130" height="22" rx="3" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="90" y="153" font-family="monospace" font-size="11" fill="#00d4ff">Computer Vision</text>
  <text x="224" y="153" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.25)">/</text>
  <text x="236" y="153" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)">MediaPipe Hands</text>
  <text x="370" y="153" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.25)">/</text>
  <text x="382" y="153" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)">WebRTC · Canvas API</text>
  <text x="546" y="153" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.25)">/</text>
  <text x="558" y="153" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)">30 FPS · Zero Install</text>

  <!-- Main headline -->
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-3">Real-time hand tracking</text>
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="rgba(255,255,255,0.35)" letter-spacing="-3">for in-air gesture drawing.</text>

  <!-- Abstract -->
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.55)" letter-spacing="0">Draw with your hands. No stylus, no touch — just your webcam and MediaPipe.</text>

  <!-- Metrics row -->
  <!-- metric 1 -->
  <rect x="80" y="460" width="160" height="68" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="492" font-family="monospace" font-size="28" font-weight="700" fill="#00d4ff">21</text>
  <text x="100" y="514" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="1">LANDMARKS / HAND</text>
  <!-- metric 2 -->
  <rect x="256" y="460" width="160" height="68" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="276" y="492" font-family="monospace" font-size="28" font-weight="700" fill="#ffffff">30 fps</text>
  <text x="276" y="514" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="1">INFERENCE TARGET</text>
  <!-- metric 3 -->
  <rect x="432" y="460" width="160" height="68" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="452" y="492" font-family="monospace" font-size="28" font-weight="700" fill="#ffffff">4</text>
  <text x="452" y="514" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="1">GESTURE STATES</text>
  <!-- metric 4 -->
  <rect x="608" y="460" width="160" height="68" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="628" y="492" font-family="monospace" font-size="28" font-weight="700" fill="#22c55e">0</text>
  <text x="628" y="514" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="1">SERVER CALLS</text>

  <!-- Right side — hand skeleton illustration -->
  <!-- Palm -->
  <ellipse cx="980" cy="340" rx="70" ry="58" fill="rgba(16,18,28,0.9)" stroke="#00d4ff" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
  <!-- Wrist -->
  <rect x="950" y="388" width="60" height="28" rx="8" fill="rgba(16,18,28,0.9)" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <!-- Index finger (extended) -->
  <line x1="960" y1="300" x2="960" y2="220" stroke="#00d4ff" stroke-width="10" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <circle cx="960" cy="215" r="8" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="960" cy="215" r="14" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <!-- Middle finger (curled) -->
  <line x1="985" y1="295" x2="985" y2="278" stroke="rgba(255,255,255,0.2)" stroke-width="9" stroke-linecap="round"/>
  <!-- Ring finger (curled) -->
  <line x1="1008" y1="298" x2="1008" y2="282" stroke="rgba(255,255,255,0.2)" stroke-width="9" stroke-linecap="round"/>
  <!-- Pinky (curled) -->
  <line x1="1028" y1="308" x2="1028" y2="295" stroke="rgba(255,255,255,0.2)" stroke-width="8" stroke-linecap="round"/>
  <!-- Thumb -->
  <line x1="938" y1="325" x2="918" y2="298" stroke="rgba(255,255,255,0.2)" stroke-width="9" stroke-linecap="round"/>

  <!-- Cursor trail -->
  <path d="M 860 180 Q 900 160 920 200 Q 940 240 900 260 Q 860 280 840 320" stroke="#00d4ff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>

  <!-- HUD chip -->
  <rect x="840" y="430" width="180" height="72" rx="8" fill="rgba(13,16,23,0.9)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="856" y="454" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)">gesture</text>
  <text x="940" y="454" font-family="monospace" font-size="11" fill="#00d4ff">draw</text>
  <text x="856" y="472" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)">hand</text>
  <text x="940" y="472" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)">Right</text>
  <text x="856" y="490" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)">fps</text>
  <text x="940" y="490" font-family="monospace" font-size="11" fill="#22c55e">30</text>
</svg>