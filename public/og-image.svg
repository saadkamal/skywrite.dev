<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#0d1020"/>
    </linearGradient>
    <radialGradient id="orb1" cx="180" cy="180" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(0,212,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,212,255,0)"/>
    </radialGradient>
    <radialGradient id="orb2" cx="1050" cy="450" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(192,38,211,0.10)"/>
      <stop offset="100%" stop-color="rgba(192,38,211,0)"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Orbs -->
  <circle cx="180" cy="180" r="320" fill="url(#orb1)"/>
  <circle cx="1050" cy="450" r="260" fill="url(#orb2)"/>

  <!-- Grid lines -->
  <g stroke="rgba(0,212,255,0.035)" stroke-width="1">
    <line x1="48"   y1="0" x2="48"   y2="630"/>
    <line x1="96"   y1="0" x2="96"   y2="630"/>
    <line x1="144"  y1="0" x2="144"  y2="630"/>
    <line x1="192"  y1="0" x2="192"  y2="630"/>
    <line x1="240"  y1="0" x2="240"  y2="630"/>
    <line x1="288"  y1="0" x2="288"  y2="630"/>
    <line x1="336"  y1="0" x2="336"  y2="630"/>
    <line x1="384"  y1="0" x2="384"  y2="630"/>
    <line x1="432"  y1="0" x2="432"  y2="630"/>
    <line x1="480"  y1="0" x2="480"  y2="630"/>
    <line x1="528"  y1="0" x2="528"  y2="630"/>
    <line x1="576"  y1="0" x2="576"  y2="630"/>
    <line x1="624"  y1="0" x2="624"  y2="630"/>
    <line x1="672"  y1="0" x2="672"  y2="630"/>
    <line x1="720"  y1="0" x2="720"  y2="630"/>
    <line x1="768"  y1="0" x2="768"  y2="630"/>
    <line x1="816"  y1="0" x2="816"  y2="630"/>
    <line x1="864"  y1="0" x2="864"  y2="630"/>
    <line x1="912"  y1="0" x2="912"  y2="630"/>
    <line x1="960"  y1="0" x2="960"  y2="630"/>
    <line x1="1008" y1="0" x2="1008" y2="630"/>
    <line x1="1056" y1="0" x2="1056" y2="630"/>
    <line x1="1104" y1="0" x2="1104" y2="630"/>
    <line x1="1152" y1="0" x2="1152" y2="630"/>
    <line x1="0" y1="48"  x2="1200" y2="48"/>
    <line x1="0" y1="96"  x2="1200" y2="96"/>
    <line x1="0" y1="144" x2="1200" y2="144"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="288" x2="1200" y2="288"/>
    <line x1="0" y1="336" x2="1200" y2="336"/>
    <line x1="0" y1="384" x2="1200" y2="384"/>
    <line x1="0" y1="432" x2="1200" y2="432"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="528" x2="1200" y2="528"/>
    <line x1="0" y1="576" x2="1200" y2="576"/>
  </g>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="14" fill="none" stroke="rgba(0,212,255,0.18)" stroke-width="1"/>

  <!-- Corner brackets — TL -->
  <path d="M40,88 L40,40 L88,40"     fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- TR -->
  <path d="M1112,40 L1160,40 L1160,88" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- BL -->
  <path d="M40,542 L40,590 L88,590"  fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- BR -->
  <path d="M1112,590 L1160,590 L1160,542" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── Logo row ── -->
  <text x="80" y="116" font-family="monospace" font-size="18" fill="#00d4ff">◆</text>
  <text x="106" y="116" font-family="monospace" font-size="20" font-weight="600" fill="#ffffff" letter-spacing="-0.5">skywrite</text>
  <rect x="198" y="98" width="32" height="20" rx="3" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="202" y="112" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.35)">v0.1</text>

  <!-- ── Tag chips ── -->
  <rect x="80" y="134" width="136" height="22" rx="3" fill="rgba(0,212,255,0.07)" stroke="rgba(0,212,255,0.22)" stroke-width="1"/>
  <text x="90" y="149" font-family="monospace" font-size="11" fill="#00d4ff">Computer Vision</text>
  <text x="228" y="149" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.22)">/</text>
  <text x="240" y="149" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.38)">MediaPipe Hands</text>
  <text x="378" y="149" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.22)">/</text>
  <text x="390" y="149" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.38)">WebRTC · Canvas API</text>
  <text x="558" y="149" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.22)">/</text>
  <text x="570" y="149" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.38)">30 FPS · Zero Install</text>

  <!-- ── Main headline ── -->
  <text x="80" y="268" font-family="system-ui,-apple-system,sans-serif" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-2.5">Real-time hand tracking</text>
  <text x="80" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="70" font-weight="800" fill="rgba(255,255,255,0.32)" letter-spacing="-2.5">for in-air gesture drawing.</text>

  <!-- ── Subtext ── -->
  <text x="80" y="412" font-family="system-ui,-apple-system,sans-serif" font-size="19" fill="rgba(255,255,255,0.52)">Draw with your hands. No stylus, no touch — just your webcam and MediaPipe. Zero install.</text>

  <!-- ── Metric boxes ── -->
  <!-- 1 -->
  <rect x="80"  y="452" width="155" height="66" rx="6" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="100" y="486" font-family="monospace" font-size="28" font-weight="700" fill="#00d4ff">21</text>
  <text x="100" y="506" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.32)" letter-spacing="1">LANDMARKS / HAND</text>
  <!-- 2 -->
  <rect x="248" y="452" width="155" height="66" rx="6" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="268" y="486" font-family="monospace" font-size="28" font-weight="700" fill="#ffffff">30 fps</text>
  <text x="268" y="506" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.32)" letter-spacing="1">INFERENCE TARGET</text>
  <!-- 3 -->
  <rect x="416" y="452" width="155" height="66" rx="6" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="436" y="486" font-family="monospace" font-size="28" font-weight="700" fill="#ffffff">4</text>
  <text x="436" y="506" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.32)" letter-spacing="1">GESTURE STATES</text>
  <!-- 4 -->
  <rect x="584" y="452" width="155" height="66" rx="6" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="604" y="486" font-family="monospace" font-size="28" font-weight="700" fill="#22c55e">0</text>
  <text x="604" y="506" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.32)" letter-spacing="1">SERVER CALLS</text>

  <!-- ── Hand skeleton (right side) ── -->
  <!-- Palm -->
  <ellipse cx="978" cy="338" rx="68" ry="56" fill="rgba(13,15,24,0.92)" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Wrist -->
  <rect x="948" y="386" width="60" height="26" rx="7" fill="rgba(13,15,24,0.92)" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  <!-- Curled fingers -->
  <line x1="983" y1="293" x2="983" y2="276" stroke="rgba(255,255,255,0.18)" stroke-width="9" stroke-linecap="round"/>
  <line x1="1006" y1="296" x2="1006" y2="280" stroke="rgba(255,255,255,0.18)" stroke-width="9" stroke-linecap="round"/>
  <line x1="1026" y1="306" x2="1026" y2="293" stroke="rgba(255,255,255,0.18)" stroke-width="8" stroke-linecap="round"/>
  <!-- Thumb curled -->
  <line x1="936" y1="323" x2="916" y2="296" stroke="rgba(255,255,255,0.18)" stroke-width="9" stroke-linecap="round"/>
  <!-- Index finger extended -->
  <line x1="958" y1="298" x2="958" y2="210" stroke="#00d4ff" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Fingertip dot -->
  <circle cx="958" cy="205" r="8" fill="#00d4ff" filter="url(#glow)"/>
  <!-- Cursor ring -->
  <circle cx="958" cy="205" r="15" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.45"/>
  <!-- Arming arc -->
  <path d="M958,188 A17,17 0 0,1 975,205" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Cursor trail / drawing path -->
  <path d="M820,175 Q865,150 885,195 Q905,240 865,262 Q825,284 808,328" fill="none" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" opacity="0.45" filter="url(#glow)"/>

  <!-- HUD chip -->
  <rect x="838" y="428" width="182" height="76" rx="8" fill="rgba(10,12,20,0.92)" stroke="rgba(0,212,255,0.22)" stroke-width="1"/>
  <text x="854" y="450" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.38)">gesture</text>
  <text x="938" y="450" font-family="monospace" font-size="11" fill="#00d4ff">draw</text>
  <text x="854" y="468" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.38)">hand</text>
  <text x="938" y="468" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.82)">Right</text>
  <text x="854" y="486" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.38)">fps</text>
  <text x="938" y="486" font-family="monospace" font-size="11" fill="#22c55e">30</text>
  <!-- cam indicator -->
  <circle cx="854" cy="500" r="4" fill="#22c55e"/>
  <text x="864" y="504" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.35)">cam:on</text>
</svg>